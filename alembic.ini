# Alembic CLI config for developers: `uv run alembic revision --autogenerate -m "..."`.
# The database URL comes from DATABASE_URL (see semanticone/config.py).
[alembic]
script_location = semanticone/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
