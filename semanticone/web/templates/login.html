{% extends "base.html" %}
{% block title %}Sign in · SemanticOne{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Sign in</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
  </form>
  <p class="muted small" style="margin-top:14px"><a href="/forgot">Forgot your password?</a> · New here? <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
